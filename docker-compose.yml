services:
  mysql:
    image: mysql:8.4
    container_name: mediroute-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local-root-change-me
      MYSQL_DATABASE: mediroute
      MYSQL_USER: mediroute
      MYSQL_PASSWORD: change-me
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mediroute", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: mediroute-qdrant
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  mysql_data:
  qdrant_data:
