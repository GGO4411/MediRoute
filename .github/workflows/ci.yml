name: MediRoute CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: mediroute
          MYSQL_USER: mediroute
          MYSQL_PASSWORD: test-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: test-root-password
      MYSQL_USER: mediroute
      MYSQL_PASSWORD: test-db-password
      MYSQL_DATABASE: mediroute
      AUTH_SECRET: github-actions-test-secret-at-least-32-characters
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run db:init
      - run: npm run db:seed
      - run: npm run test:db
      - name: Execute SQL DML and query showcases
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < db/dml_examples.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < db/query_showcase.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < db/database_rbac.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < db/database_roles.sql
      - run: npm run test:triage
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - run: npm run vectors:seed
      - run: npm run test:vectors
      - run: npm run build
